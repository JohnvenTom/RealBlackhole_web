<!doctypehtml><html lang=en><head><meta charset=utf-8><meta content="width=device-width,initial-scale=1,user-scalable=no"name=viewport><title>Blackhole</title><style>body{margin:0;padding:0;overflow:hidden;background:#000}#canvas-wrapper{position:fixed;top:0;left:0;width:100vw;height:100vh;overflow:hidden}canvas{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);display:block}#gpu-warning{display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:9999;background:rgba(0,0,0,.85);font-family:Consolas,Monaco,'Courier New',monospace;color:#e0e0e0;flex-direction:column;align-items:center;justify-content:center;text-align:center;user-select:none}#gpu-warning .warning-icon{font-size:48px;margin-bottom:16px}#gpu-warning .warning-title{font-size:22px;font-weight:700;color:#ff6b4a;margin-bottom:12px;letter-spacing:2px}#gpu-warning .warning-gpu{font-size:15px;color:#888;margin-bottom:20px;padding:8px 16px;border:1px solid #333;border-radius:4px;background:rgba(255,255,255,.03)}#gpu-warning .warning-steps{font-size:13px;line-height:2;color:#aaa;max-width:520px;text-align:left;padding:16px 24px;border:1px solid #333;border-radius:4px;background:rgba(255,255,255,.02);margin-bottom:20px}#gpu-warning .warning-steps code{color:#7eb8ff;background:rgba(126,184,255,.1);padding:1px 6px;border-radius:3px;font-size:12px}#gpu-warning .dismiss-btn{padding:10px 32px;font-size:14px;font-family:inherit;color:#ccc;background:0 0;border:1px solid #555;border-radius:4px;cursor:pointer;letter-spacing:1px;transition:all .2s}#gpu-warning .dismiss-btn:hover{color:#fff;border-color:#888;background:rgba(255,255,255,.05)}</style></head><body><div id=canvas-wrapper><canvas id=canvas oncontextmenu=event.preventDefault()></canvas></div><div id=gpu-warning><div class=warning-icon>⚠</div><div class=warning-title>INTEGRATED GPU DETECTED</div><div class=warning-gpu id=gpu-name></div><div class=warning-steps>Switch to discrete GPU for better performance:<br><br>1. Open <code>Windows Settings → System → Display → Graphics</code><br>2. Browse to your browser executable:<br>  <code>chrome.exe</code> or <code>msedge.exe</code><br>3. Select <code>High Performance</code> (NVIDIA / AMD)<br>4. Restart browser</div><button class=dismiss-btn onclick='document.getElementById("gpu-warning").style.display="none"'>DISMISS</button></div><script>var canvas=document.getElementById("canvas");canvas.width=1920,canvas.height=1080;var ASPECT=16/9;function resizeCanvas(){var e=window.innerWidth,t=window.innerHeight;e/t>ASPECT?(canvas.style.width=t*ASPECT+"px",canvas.style.height=t+"px"):(canvas.style.width=e+"px",canvas.style.height=e/ASPECT+"px")}window.addEventListener("resize",resizeCanvas),resizeCanvas();var _origGetContext=HTMLCanvasElement.prototype.getContext;HTMLCanvasElement.prototype.getContext=function(e,t){return"webgl"!==e&&"webgl2"!==e&&"experimental-webgl"!==e||((t=t||{}).powerPreference="high-performance"),_origGetContext.call(this,e,t)};var Module={canvas:canvas};!function(){try{var e=document.createElement("canvas"),t=e.getContext("webgl2")||e.getContext("webgl");if(!t)return;var n=t.getExtension("WEBGL_debug_renderer_info");if(!n)return;var a=t.getParameter(n.UNMASKED_RENDERER_WEBGL);/intel|uhd|hd\s*graphics|iris|xe\s*graphics/i.test(a)&&(document.getElementById("gpu-name").textContent="Current: "+a,document.getElementById("gpu-warning").style.display="flex")}catch(e){}}()</script><script async src=BlackholeWeb.js></script></body></html>
